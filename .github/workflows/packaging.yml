name: Release Packaging

on:
  push:
    branches:
      - simplify-chinese-1.08.2
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  linux:
    name: Linux AppImage
    runs-on: ubuntu-22.04
    steps:
      - name: Clone Repository
        uses: actions/checkout@v6

      - name: Install .NET 6.0
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '6.0.x'

      - name: Package AppImage
        run: |
          make engine
          sudo apt-get install -y desktop-file-utils
          mkdir -p build/linux
          GIT_TAG="1.08.2"
          ./packaging/linux/buildpackage.sh "${GIT_TAG}" "${PWD}/build/linux"

      - name: Upload AppImage
        uses: actions/upload-artifact@v5
        with:
          name: CombinedArms_Simplified_Chinese-1.08.2-Linux-x86_64
          path: build/linux/*.AppImage
          if-no-files-found: error

  macos:
    name: macOS Disk Image
    runs-on: macos-14
    steps:
      - name: Clone Repository
        uses: actions/checkout@v6

      - name: Install .NET 6.0
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '6.0.x'

      - name: Package Disk Image
        run: |
          make engine
          mkdir -p build/macos
          GIT_TAG="1.08.2"
          ./packaging/macos/buildpackage.sh "${GIT_TAG}" "${PWD}/build/macos"

      - name: Upload DMG
        uses: actions/upload-artifact@v5
        with:
          name: CombinedArms_Simplified_Chinese-1.08.2-macOS
          path: build/macos/*.dmg
          if-no-files-found: error

  windows:
    name: Windows Installer
    runs-on: ubuntu-22.04
    steps:
      - name: Clone Repository
        uses: actions/checkout@v6

      - name: Install .NET 6.0
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '6.0.x'

      - name: Package Installer
        run: |
          make engine
          sudo apt-get update
          sudo apt-get install -y nsis wine64
          mkdir -p build/windows
          GIT_TAG="1.08.2"
          ./packaging/windows/buildpackage.sh "${GIT_TAG}" "${PWD}/build/windows"

      - name: Upload Installer
        uses: actions/upload-artifact@v5
        with:
          name: CombinedArms_Simplified_Chinese-1.08.2-Windows
          path: build/windows/*.exe
          if-no-files-found: error
