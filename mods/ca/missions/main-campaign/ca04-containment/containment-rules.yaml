World:
	LuaScript:
		Scripts: campaign.lua, containment.lua
	MissionData:
		Briefing: 情报报告称，苏联正准备用核武器攻击他们破损的时空传送仪，试图终结其持续造成的破坏。他们根本不知道自己在对付什么。如果他们成功了，后果可能是灾难性的。\n\n我们没有足够的时间发动全面进攻，因此最好的选择是一次小规模的秘密行动，摧毁他们的导弹发射井。\n\n该地区的大部分苏军正忙于击退外星入侵者，因此这里的基地对这样的攻击相当脆弱。如果一切按计划进行，等他们意识到存在重大威胁时，一切为时已晚。\n\n我们一直在准备自己遏制时空传送仪的手段，假设我们成功阻止了苏联的发射，那么现在正是测试它的最佳时机。\n\n首先，你必须摧毁为苏联特斯拉线圈供电的三座原子反应堆，以便我们的突击队能绕过剩余的防御设施。\n\n其次，摧毁沿岸的防空导弹阵地，为我们实施遏制行动扫清道路。\n\n第三，摧毁两座即将发射的导弹发射井。\n\n随后我们将派出实验性武器。护送它到达时空传送仪并将其中和。
	MapOptions:
		ShortGameCheckboxEnabled: False
	ScriptLobbyDropdown@RESPAWN:
		ID: respawn
		Label: Respawns
		Description: Enable/disable respawning on death
		Values:
