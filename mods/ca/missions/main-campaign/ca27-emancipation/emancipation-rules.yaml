# Simplified Chinese translation by lsxy, 2026.06.
^Palettes:
	TintPostProcessEffect:
	PaletteFromFile@terrain-temperat:
		Filename: ca|missions/main-campaign/ca22-decimation/fall.pal

World:
	LuaScript:
		Scripts: campaign.lua, emancipation.lua
	MissionData:
		Briefing: 指挥官，一场灾难发生了。我们在前线附近的数个基地——那些被用作最后进攻集结地的基地——已经落入思金人的心灵控制之下。\n\n我们之前遭遇过思金人的主脑，但我们不知道它们的能力能达到如此规模。\n\n我们的高级机器人指挥部已经开始大规模动员无人机部队，因为我们不能冒险派遣任何易受心灵控制的部队。\n\n你的任务是带领部分无人机部队，用它们来消灭思金人的主脑。虽然我们不能确定，但我们认为杀死一名主脑将释放所有被其奴役的心灵。\n\n注意不要杀死处于思金人控制下的全球防御组织(GDI)部队。一旦你重新控制了我们所有的基地，摧毁该地区的思金人势力。
	MapOptions:
		ShortGameCheckboxEnabled: False
	MusicPlaylist:
		StartingMusic: march

Player:
	PlayerResources:
		DefaultCash: 0

# Disable powers for AI

^InterceptorsPower:
	InterceptorPower@AirDef:
		Prerequisites: ~aircraft.gdi, ~!botplayer

amcv.enabled:
	AlwaysVisible:
	Interactable:
	ScriptTriggers:
	ProvidesPrerequisite:

AMCV:
	Buildable:
		Prerequisites: vehicles.mcv, ~amcv.enabled, ~vehicles.td

MAST:
	MindController:
		Capacity: 0
	GrantCondition@mindcontrolling:
		Condition: mindcontrolling
	-WithDecoration@COMMANDOSKULL:
	-ChangesHealth@CommandoRegen:

MSHP:
	Inherits@CAMPAIGNDISABLED: ^Disabled

MSAR:
	MustBeDestroyed:
		RequiredForShortGame: true

EYE:
	Inherits@CAMPAIGNDISABLED: ^Disabled

GDRN:
	RevealsShroud:
		Range: 8c0
	Buildable:
		Prerequisites: ~vehicles.gdi, ~!tow.upgrade

GDRN.TOW:
	Buildable:
		Prerequisites: ~vehicles.gdi, ~tow.upgrade

MDRN:
	Buildable:
		Prerequisites: anyradar, ~vehicles.gdi

UAV:
	-Targetable@AIRBORNE:
	RevealsShroud:
		Range: 12c0
		MinRange: 10c0
	RevealsShroud@GAPGEN:
		Range: 10c0

bdrone.upgrade:
	-Buildable:
	-AnnounceOnCreation:

mdrone.upgrade:
	-Buildable:
	-AnnounceOnCreation:

