World:
	LuaScript:
		Scripts: campaign.lua, conduit.lua
	MissionData:
		Briefing: |-
			令我们大为惊讶的是，一个拥有巨大灵能力的思金生物——那个所谓的神童，曾夺取了我们对凯恩生化人的控制权——与尤里关押在同一处监狱。

			在监禁期间，尤里得以与这个生物交流，他认为与其主人——思金人的主宰——联手可能带来巨大的互利。

			如果GDI的消息来源可信，恐怖分子凯恩给主宰带来了巨大麻烦：煽动内战，威胁主宰持续数千年的权力掌控。我们在这个关键时刻提供援助将使主宰欠我们人情，我们必将获得丰厚的回报。

			凯恩妄想般的圣战必须被阻止。我们必须抓住这个机会，不仅为一个文明，而是为两个文明带来和平与稳定。有了主宰的支持，我们将拥有彻底消灭敌人的力量，苏联至上的时代终将到来。

			由于通往他们母星的多个传送门仍然敞开，思金神童得以与他的主人保持通讯。忠臣部队遭受了重大失败，凯恩似乎正准备率领他庞大的生化人大军返回地球，而思金反抗军则继续蚕食主宰的剩余部队。

			我们的目标很简单：攻击Nod兄弟会的基地——那里已为凯恩的回归准备好了传送门——切断他的退路。与此同时，我方部队正在准备通过传送门，以便我们能够扭转战局，使局势朝着有利于主宰的方向发展。
	Player:
		PlayerResources:
			DefaultCash: 6000

