World:
	LuaScript:
		Scripts: campaign.lua, procurement.lua
	MissionData:
		Briefing: |-
			随着我们的对手被击败，我们现在必须开始重建部队。我们的生产能力被思金人摧毁，因此我们必须另寻装备以满足眼前需求。

			中国长期以来一直自私地优先考虑自身经济利益，拒绝向我们提供军事援助，然而他们低调而迅速的军事集结引起了全球防御组织(GDI)的注意。GDI以"维护地区稳定"为借口，在中国边境不远处建立了大规模的军事存在。

			这不出所料地激怒了中国领导层，因此我们与他们秘密达成了一项协议。

			你必须带领一支小部队前往边境附近一个存放中国车辆的仓库。将这些车辆开过边境，摧毁最近的GDI前哨站。然后我们可以派遣增援部队建立我们自己的基地，并消灭剩余的GDI存在。

			这样一来，GDI将被清除，而中国无需直接介入，同时中国也能在与同等对手的实战中测试他们的新武器。作为回报，他们同意向我们出售武器，这将使我们能够以极大的加速度恢复到满员战力。
	Player:
		PlayerResources:
			DefaultCash: 6000

