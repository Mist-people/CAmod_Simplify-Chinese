
# Simplified Chinese translation by lsxy, 2026.06.
^Palettes:
	TintPostProcessEffect:
		Red: 0.95
		Green: 0.95
		Blue: 1
		Ambient: 0.9
	WeatherOverlay:
		ParticleDensityFactor: 4
		Gravity: 16, 24
		WindTick: 150, 425
		ScatterDirection: -12, 12
		ParticleSize: 2, 3
		ParticleColors: ECECEC44, E4E4E444, D0D0D044, BCBCBC44
		LineTailAlphaValue: 0

World:
	LuaScript:
		Scripts: campaign.lua, statecraft.lua
	MissionData:
		Briefing:  斯大林已经倒下，联盟陷入混乱。一批野心勃勃的将军和高级官员正在争夺权力。我们必须迅速行动，巩固我们的地位并恢复秩序。让我们携手将苏联帝国从全面崩溃的边缘拉回。

带上我们能抽调出的少量部队建立基地，然后镇压三个最突出的派系。

这三个派系分别由马林涅斯科将军、克鲁科夫将军和罗曼诺夫副主席领导，每个人都有自己的作战风格。运用你的最佳判断来决定先对付谁，但要小心不要过快打破权力平衡，否则他们可能会联合起来对付你。
Player:
	PlayerResources:
		DefaultCash: 6000
	-GrantExternalConditionPowerCA@HEROESOFUNION:
	-ParatroopersPowerCA@TankDrop:
	-AirstrikePowerCA@KillZone:

INDP:
	Inherits@TankDrop: ^TankDropPower
	ParatroopersPowerCA@TankDrop:
		Prerequisites: ~captured.indp
	CaptureManager:
	Capturable:
		RequiresCondition: !build-incomplete && !being-warped
		Types: building
	CapturableProgressBar:
	CapturableProgressBlink:
	TooltipExtras:
		Attributes: • Maximum 1 can be built

MUNP:
	Inherits@KillZone: ^KillZonePower
	AirstrikePowerCA@KillZone:
		-Prerequisites:
	CaptureManager:
	Capturable:
		RequiresCondition: !build-incomplete && !being-warped
		Types: building
	CapturableProgressBar:
	CapturableProgressBlink:
	TooltipExtras:
		Attributes: • Maximum 1 can be built

CVAT:
	Inherits@HeroesOfTheUnion: ^HeroesOfTheUnionPower
	GrantExternalConditionPowerCA@HEROESOFUNION:
		-Prerequisites:
	CaptureManager:
	Capturable:
		RequiresCondition: !build-incomplete && !being-warped
		Types: building
	CapturableProgressBar:
	CapturableProgressBlink:
	TooltipExtras:
		Attributes: • Maximum 1 can be built

captured.indp:
	Inherits@DUMMY: ^InvisibleDummy
	ProvidesPrerequisite:

MISS:
