World:
	LuaScript:
		Scripts: campaign.lua, apprehension.lua
	MissionData:
		Briefing: 就在时空传送仪被中和之际，我们探测到有运输单位正在撤离，随后迅速消失。GDI提供的情报表明，这些部队很可能属于一个名为Nod兄弟会的组织，该组织大量使用这种隐形技术。\n\n我们不清楚他们在那里做什么，但据我们掌握的情况，时空传送仪技术落入他们手中将极为不利。\n\n我们一直在追踪向南移动的Nod部队，并已确认沿海的一座小型基地极有可能是他们的目的地。我们现在有一个机会窗口，可以捕获这些运输单位并获取对Nod行动的情报。\n\n带领一支突击队进入Nod基地周围的森林，摧毁他们的防空导弹阵地。我们预计Nod会派出小股部队进行侦察，这样你就能逐个伏击他们，而无需同时面对其全部兵力。\n\n一旦所有防空导弹阵地被摧毁，我们将派出空中支援清除基地的防御力量。随后你应能肃清基地内残余的部队并俘获那些运输单位。
	MapOptions:
		ShortGameCheckboxEnabled: False
