# Simplified Chinese translation by lsxy, 2026.06.
^Palettes:
	TintPostProcessEffect:

World:
	LuaScript:
		Scripts: campaign.lua, deliverance.lua
	MissionData:
		Briefing: 一个自称"全球防御组织"的武装力量与我们取得了联系。虽然我们对这一组织一无所知，但我们有理由相信他们能对正在发生的一切提供一些线索。\n\n一座GDI基地显然出现在了苏联领土内部。他们的指挥官被俘，部队即将被苏军击溃。\n\n率领一支分遣队找到该基地——假设这不是苏联的诡计——坚守阵地直至援军抵达。\n\n由于指挥官被俘，加之时空剧变导致指挥系统陷入混乱，GDI部队已同意服从你的指挥。待我方阵地稳固后，找到并营救GDI指挥官。\n\n我们还无法确定能否信任这些人，因此保持警惕。希望我们找到了一位新盟友，而营救他们的指挥官无疑是迈向巩固这一联盟的良好第一步。
		LossVideo: battle.vqa
	MapOptions:
		ShortGameCheckboxEnabled: False
	MusicPlaylist:
		StartingMusic: aoi

Player:
	PlayerResources:
		DefaultCash: 3500

