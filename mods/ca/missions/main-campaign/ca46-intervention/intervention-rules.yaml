World:
	LuaScript:
		Scripts: campaign.lua, intervention.lua
	MissionData:
		Briefing: 霍桑将军得以通过传送门逃脱，其下落不明。对他一名副官的审讯揭示，他一直在与苏联秘密勾结，这有助于解释全球防御组织(GDI)近来不愿合作的原因。\n\n或许他对凯恩和兄弟会的仇恨超乎任何人想象，足以动摇他的忠诚和判断，又或许他是另一个不幸的心灵控制受害者。我们预计这不会是最后一次见到他。\n\n传送门与思金人母星上全球防御组织(GDI)部队的连接已重新建立，其领导层已恢复控制。急需的补给已送达星际部队。与更多特工的联系也已恢复，我们的注意力现在必须转向兄弟会。\n\n泰伯利亚净化设备落入主宰之手，使凯恩解放思金人摆脱泰伯利亚依赖的努力停滞不前，令许多原本可能起义反抗主宰的思金人继续臣服于他。Nod兄弟会和反抗军部队现在还要应对邪灵思金人，逐渐失去阵地。\n\n地球上的Nod兄弟会部队目前完全与凯恩隔绝，我们相信他们正全力准备建立一个新的传送门。在菲律宾附近探测到异常集中的Nod兄弟会部队，并有视觉确认大量泰伯利亚储备。我们上次看到如此大规模的储备还是思金人准备自己的传送门时。\n\n我们在该地区没有大量兵力，需要你建立一个前进基地，以便加强并向Nod兄弟会部队发动攻击。泰伯利亚被储存在众多小岛的仓库中。你必须摧毁或占领所有这些仓库，从而消除Nod兄弟会打开传送门的任何直接可能性。\n\n该地区资源稀缺，建议你占领而非摧毁遇到的仓库，以利用额外资金。\n\n我们的韩国合作伙伴正在为本次任务提供支援。他们的黑鹰战斗机对于控制岛屿上空将至关重要。
	MapOptions:
		ShortGameCheckboxEnabled: False
	MusicPlaylist:
		StartingMusic: creep

