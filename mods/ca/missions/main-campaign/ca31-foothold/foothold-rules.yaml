World:
	LuaScript:
		Scripts: campaign.lua, foothold.lua
	MissionData:
		Briefing: ———[    第六章 序章    ]———\n\n当思金人母舰燃烧着从天际坠落时，其周围的生化人揭示了他们真正的归属。被困于空间与时间之中的思金人，被操纵着打开了通往其母星的传送门，而凯恩的军队就守在门后。\n\n虽然他的最终目的尚不明朗，但全球防御组织(GDI)不愿让他毫无阻碍地追求其目标。传送门仍然敞开着，但正在迅速失稳，似乎很快就会崩溃。全球防御组织(GDI)追击的时间所剩无几。\n\n———[    任务简报（全球防御组织(GDI)）    ]———\n\n我们的部队已基本准备就绪，侦察无人机已确认传送门另一侧的大气和气候条件适合人类生存。\n\n显然，这是未知领域。我们必须建立一个立足点作为行动基地。我们在目的地附近探测到极少的思金人存在，也没有发现凯恩或其军队的踪迹。\n\n凯恩离开后不久，我们检测到思金人信号发射器发出的能量激增。我们相信这是因为传送门的出口点被移动了。凯恩显然不想让我们紧随其后，但这引出了一个问题——他为什么还要留着这扇门呢？\n\n传送门已经变得过于不稳定，重型装备无法通过，但自思金人到来以来对其虫洞技术的研究使我们对传送门的工作原理有了一定的了解。\n\n传送门需要双向能量流来维持。我们这一侧没有问题，但如果没有另一侧的相应传输，传送门最终将失去凝聚力。\n\n思金人的神经中枢能够提供这样的能量流，因此如果我们能找到并占领一个离出口点足够近的神经中枢，传送门应该就能稳定下来。\n\n你的首要任务是在出口点周围区域部署传感器阵列。这样我们应该就能探测到适合占领的神经中枢，从而得以运送更重型的部队并建立基地。然后必须清除该区域内的所有残余敌对势力。
	MapOptions:
		ShortGameCheckboxEnabled: False
	MusicPlaylist:
		StartingMusic: whatlurk

