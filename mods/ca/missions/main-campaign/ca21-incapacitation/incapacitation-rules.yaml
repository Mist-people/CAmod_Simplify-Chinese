# Simplified Chinese translation by lsxy, 2026.06.
^Palettes:
	PaletteFromFile@terrain-temperat:
		Filename: ca|missions/main-campaign/ca21-incapacitation/incapacitation.pal
	FlashPostProcessEffect@LIGHTNINGSTRIKE:
		Type: LightningStrike
	FlashPostProcessEffect@IONSTRIKE:
		Type: IonStrike
		Color: D48FFF
	TintPostProcessEffect:
		Red: 1.2
		Green: 1
		Blue: 1.2
		Ambient: 0.7

World:
	LuaScript:
		Scripts: campaign.lua, incapacitation.lua
	MissionData:
		Briefing: 该地区发现了两支人类派系的大量航空器集结，已被判定为需要处理的下一个重要威胁。\n\n你已被分配一支小型特遣部队，必须用其消灭这些航空器及其着陆区域。\n\n你还必须摧毁所有防空防御设施。这将确保我们的舰队能够以最小的空中阻力重新部署到中央储藏库。\n\n一场离子风暴已经生成，以确保所有敌方航空器在本任务期间被限制在地面。维持风暴所需的能量巨大；请勿浪费时间。
	MapOptions:
		ShortGameCheckboxEnabled: False
	ScriptLobbyDropdown@RESPAWN:
		ID: respawn
		Label: Respawns
		Description: Enable/disable respawning on death
		Values:
			enabled: Enabled
			disabled: Disabled
		Default: disabled
		DisplayOrder: 999
	MusicPlaylist:
		StartingMusic: rainnite

Player:
	PlayerResources:
		DefaultCash: 0

^GroundedAircraft:
	ExternalCondition@GROUNDED:
		Condition: grounded
	AutoTarget:
		InitialStanceAI: HoldFire
	DamageMultiplier@GROUNDED:
