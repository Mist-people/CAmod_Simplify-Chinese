# Simplified Chinese translation by lsxy, 2026.06.
^Palettes:
	TintPostProcessEffect:

World:
	LuaScript:
		Scripts: campaign.lua, enmity.lua
	MissionData:
		Briefing: ———[    第五章 序章    ]———\n\n思金人的势力正在迅速扩张。凯恩已经消失，他的大部分生化人军团以及大量苏联部队如今都处于思金人的控制之下。\n\n兄弟会的其余部分已经分裂。一些人自愿加入了思金人，视其为新时代的真正先驱，而另一些人则坚信凯恩终将归来，继续与我们和入侵者作战。\n\n苏联的复兴昙花一现，他们再次陷入了混乱。斯大林已撤退至西伯利亚，没有尤里，他们的进攻能力十分有限。然而斯大林仍然拒绝谈判停火，其行为不可预测。\n\n我们失去了许多地盘，但我们相信仍有希望。我们认为思金人原本并不打算如此依赖人类部队来为其效命，他们之所以这样做，只是因为无法获得增援。他们的入侵力量不足，局势比他们想要我们相信的更为岌岌可危。\n\n他们一直在巩固领土并囤积泰伯利亚。他们正在为某件事做准备，我们需要查明真相。\n\n———[    任务简报    ]———\n\nNod兄弟会部队持续袭击我们的补给线。即使事关人类的存亡，他们也无法放下仇恨。在消除Nod兄弟会的威胁之前，我们无法向思金人推进。\n\n有一条通往前线的重要路线遭受了严重破坏。一支被派去确保该地区安全的特遣队报告称，他们遭遇了Nod兄弟会的侦察兵，并怀疑另一次伏击即将来临。指挥这些部队，确保他们不被击溃。\n\n整个地区的Nod兄弟会大本营很可能就在附近，但我们迄今未能找到它。如果情况确实如此，我们将派出增援，你受命清除该区域内的所有Nod兄弟会部队。
	MapOptions:
		ShortGameCheckboxEnabled: False
	MusicPlaylist:
		StartingMusic: trouble

Player:
	PlayerResources:
		DefaultCash: 0

