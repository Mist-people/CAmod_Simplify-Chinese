World:
	LuaScript:
		Scripts: campaign.lua, proliferation.lua
	MissionData:
		Briefing: 我们尚未与母星重建通讯，因此必须最大限度地保存此地的残余部队。为此，监督者寻求对作战指挥结构进行调整。你已被认定具有潜力，现在必须证明你的指挥效能。\n\n已发现一片富含蓝色灵液的区域，目前由一个名为凯恩的本土派系控制。\n\n利用我们已经建立的前哨站，夺取所有蓝色灵液矿场并在每处开始采集作业。人类的采集活动必须清除。\n\n监督者正在协调所有行星部队的调配。增援力量将与你的采集作业价值成正比，所采集的多余灵液将被输送至中央储存库。
	MapOptions:
		ShortGameCheckboxEnabled: True
	MusicPlaylist:
		StartingMusic: dmachine

