World:
	LuaScript:
		Scripts: campaign.lua, singularity.lua
	MissionData:
		Briefing: 我们已经抵达思金人的主要大本营。一艘巨大的飞行器悬停在其上空，正将某种能量输送到下方的地面。这一定就是传送门开启的方式。我们不知道还有多少时间，但这艘母舰必须在它的任务完成之前被摧毁。\n\n你的第一个障碍将是那些被奴役的人类军队。思金人正在使用盟军、苏联和Nod兄弟会的部队作为第一道防线。如有必要可摧毁它们，但我们也可能用解救自己部队的同样方式将他们从思金人的控制中释放出来。\n\n主基地周围的防御工事正在被强化，消耗着巨大的能量。除非我们能对思金人的电力基础设施造成重大破坏，否则我们很可能无法突破这些防御。\n\n母舰本身由一道能量护盾保护；我们还不知道武器对其效果如何。卫星图像还显示有大量生化人守卫母舰，这将使地面进攻变得极其困难。\n\n为此，一个先进截击机中队已准备好攻击母舰。我们相信他们能够躲避思金人的防空火力足够长时间，以发射一轮齐射导弹。我们只能希望这足以突破护盾。\n\n如果一切手段都失败了，使用任何必要的方法摧毁护盾并击沉母舰。整个全球防御组织(GDI)的军火库都听凭你调遣。\n\n祝你好运，指挥官。
	MapOptions:
		ShortGameCheckboxEnabled: False
	MusicPlaylist:
		StartingMusic: target
	MapBuildRadius:
		AllyBuildRadiusCheckboxEnabled: True

