^BaseWorld:
	TerrainLighting:

World:
	LuaScript:
		Scripts: campaign.lua, ad-nihilum.lua
	MissionData:
		Briefing: 我们收到来自思金人母星上全球防御组织(GDI)总部的紧急且极其令人不安的通讯。其一基地一直坚守阵地抵御邪灵思金人攻击，却探测到一个巨型雷达信号正缓慢向其移动。还没等看清目标，整个基地便被歼灭。\n\n邪灵思金人迄今阻止了全球防御组织(GDI)进行更近距离的观察，但这些无疑是拥有巨大力量的战争机器，甚至可能超越主宰部署的灭世者三足机甲。\n\n我们有理由相信，这些被我们命名为"虚空引擎"的机器中，有未知数量已前往地球。全球防御组织(GDI)探测到它们穿越星际传送门，扫描显示其方向指向地球。\n\n全球防御组织(GDI)报告称思金人反抗军试图拦截其中一台机器时遭受了毁灭性损失。尚不清楚主宰或苏联是否已遭遇过它们。除了其纯粹毁灭性的力量，其确切目的也尚不清楚。\n\n地球上尚未探测到任何此类机器，我们也未能定位正在使用的星际传送门，但已发现大量邪灵思金人存在，以及三座异常巨大的传送门，这些传送门的能量不足以达到星际级别。其巨大尺寸可能正是为让这些巨型机器通过。\n\n这些传送门位于德国柏林以南——盟军领土的核心。城市疏散正在进行中，但我们更南部的几个基地已失去联系，这表明我们时间所剩无几。假设柏林是他们的目标，我们必须不惜一切代价阻止他们抵达城市。\n\n在虚空引擎突破你防线之前将其摧毁。一旦你的部队充足，摧毁思金人基地以确保传送门安全。
	MapOptions:
		ShortGameCheckboxEnabled: False
	MusicPlaylist:
		StartingMusic: malev

Player:
