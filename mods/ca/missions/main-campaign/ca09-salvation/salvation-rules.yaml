World:
	LuaScript:
		Scripts: campaign.lua, salvation.lua
	MissionData:
		Briefing: 来访者——思金人已控制了一座居住着许多无辜民众的半岛，准备在那里播撒泰伯利亚。\n\n这些民众的求救声理所当然地被无视了。兄弟会是他们唯一的希望。他们的家园，乃至他们的生命，都掌握在我们手中。\n\n率一支部队解放这座半岛。向这些人证明，在被所有人抛弃之后，Nod兄弟会将保护他们，而我相信，他们中的许多人必将加入我们的事业。\n\n由于思金人控制了此地的泰伯利亚矿场，你需要夺取这里的油井来为你的行动提供资金。
	MapOptions:
		ShortGameCheckboxEnabled: False
		TechLevel: medium
	MusicPlaylist:
		StartingMusic: chrg226m

