	MissionData:
		Briefing: 你给监督者留下了深刻印象，已被认定堪当更大的指挥职责。在母星增援抵达之前，我们必须着手巩固中央灵液储存库周边的领土。\n\n我方舰队主力正与人类部队交战，这为我们提供了对两个高优先级目标发动地面突袭的机会。\n\n观察到两个合作的人类派系正在使用强大的进攻性资产，分别是一台轨道武器平台和一台能够操纵大气条件制造局部风暴的机器。\n\n一旦我们的中央储存库被发现，他们无疑会试图用这些武器攻击它。必须摧毁它们以消除这一可能性。
