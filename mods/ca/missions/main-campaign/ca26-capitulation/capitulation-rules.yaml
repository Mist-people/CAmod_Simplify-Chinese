World:
	LuaScript:
		Scripts: campaign.lua, capitulation.lua
	MissionData:
		Briefing: 通往思金人大本营的道路现已畅通，我们正在准备发动总攻。斯大林是一颗无法忽视的变数，我们已决定最好将他从棋局中清除。\n\n他已撤退至西伯利亚一处重兵设防的基地，身边环绕着他最忠诚、最有经验的部队。由于近期思金人的入侵，苏联地面部队损失惨重，但他们的空军基本完好无损，因此预计斯大林会大量使用空中力量。\n\n他的大本营防卫极其严密，关键建筑受到一台必须隐藏在地下的铁幕装置的保护。\n\n一座原子反应堆是该基地的主要电力来源。盟军间谍报告称，该反应堆需要持续的燃料供应才能满足基地巨大的电力消耗，因此如果我们能切断其补给线，阻止额外燃料运达反应堆，它被迫关闭只是时间问题。\n\n该基地还有一个备用电源，形式为附近一座岛屿上的一组特斯拉反应堆。这些反应堆能使基地的特斯拉线圈超载充能，在进攻主基地之前应将其摧毁。\n\n我们上一次围攻拥有铁幕装置的苏联基地时结局并不美好；希望盟军的情报是准确的。
