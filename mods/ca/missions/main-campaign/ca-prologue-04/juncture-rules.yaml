		Briefing: 关键组件和补给正在被运送至一处秘密集结区。兄弟会中鲜有人知晓此行动的全部细节，但一切终将揭晓。\n\n全球防御组织(GDI)持续威胁着重要的运输路线，而你已被选中负责确保埃及境内的一条路线安全。\n\nGDI正以其舰队封锁尼罗河，这已不可接受地延误了我们的进展。\n\n建立立足点，然后你的任务是摧毁沿河岸部署的GDI防空系统。一旦扫清这些障碍，凯恩为GDI海军准备了一份"惊喜"。
