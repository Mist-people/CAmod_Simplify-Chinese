
# Simplified Chinese translation by lsxy, 2026.06.
^Palettes:
	TintPostProcessEffect:
		Red: 1
		Green: 1
		Blue: 1.2
		Ambient: 0.8
	PaletteFromFile@terrain-temperat:
		Filename: ca|missions/main-campaign/ca24-culmination/brown.pal
	FlashPostProcessEffect@Subjugation:
		Type: Subjugation
		Color: a400f2

World:
	LuaScript:
		Scripts: campaign.lua, culmination.lua
	MissionData:
		Briefing: 生化人军团现已处于我们的控制之下。我们的主脑力量大幅增长——已进化为神童——并取代尤里成为这支机械化部队的掌控者。尤里已被囚禁，他可能还有利用价值。\n\n生化人几乎可以确保我们在此达成主要目标，但我们不能留下任何变数。我们的神童已经积蓄了庞大的精神能量，主管认为我们应该通过征服更多人类派系来消除一切失败的可能性。\n\n我们已经将三个最虚弱的人类派系引入陷阱。他们以为我们的神童很脆弱，有机会将其消灭，但事实上神童能够从极远的距离直接夺取整个基地的控制权。运用你的最佳判断来决定首先控制哪个派系。神童只能施展此能力一次，之后需要离开战场休整，因此另外两个派系必须以更常规的方式逐步征服。
	MapOptions:
		ShortGameCheckboxEnabled: False
	MusicPlaylist:
		StartingMusic: timebomb

Player:
	PlayerResources:
		DefaultCash: 6000

