	RenderLine:
		Angle: 512
		Length: 95c0
		Color: ff000033
		Width: 2
		DashLength: 0c256
		FadeTicks: 50
		RequiresCondition: radarenabled
	GrantConditionOnPrerequisite@RADAR:
		Condition: radarenabled
		Prerequisites: radar-active

