# Simplified Chinese translation by lsxy, 2026.06.
^Palettes:
	PaletteFromFile@terrain-temperat:
		Filename: alien.pal
	FlashPostProcessEffect@LIGHTNINGSTRIKE:
		Type: LightningStrike
	FlashPostProcessEffect@IONSTRIKE:
		Type: IonStrike
		Color: D48FFF
	TintPostProcessEffect:
		Red: 1
		Green: 1
		Blue: 1.2
		Ambient: 0.4

^BaseWorld:
	TerrainLighting:

World:
	LuaScript:
		Scripts: campaign.lua, convergence.lua
	MissionData:
		Briefing: 我们已经在传送门另一侧建立了一支可观的部队，并持续加强我们的阵地。起初思金人似乎对我们的存在并不在意，然而我们的传感器网络探测到一支由大型思金人舰队和地面部队组成的庞大力量正高速向我们逼近。\n\n形势对我们极为不利，但我们别无选择，只能一战。如果我们失去这个立足点，思金人全面入侵地球只是时间问题，同时我们也将失去阻止凯恩计划的能力（假设思金人还没有替他完成这件事）。\n\n我们的一个偏远前哨站似乎被推进中的思金人部队无视了，他们似乎正径直朝我们的主基地扑来。\n\n我们北部的主防线仍在建设中。你的任务是尽可能加强防御，阻止思金人舰队突破防线。
	MapOptions:
		ShortGameCheckboxEnabled: False
	MusicPlaylist:
		StartingMusic: heroism

Player:
	PlayerResources:
		DefaultCash: 6000

# Enable subfaction specific tech

XO:
	Buildable:
		Prerequisites: gtek, ~vehicles.gdi

WOLV:
	Buildable:
		Prerequisites: gtek, ~vehicles.gdi

PBUL:
	Buildable:
		Prerequisites: gtek, ~vehicles.gdi

STWR:
	Buildable:
		Prerequisites: vehicles.any, ~structures.gdi

ionmam.upgrade:
	Buildable:
		Prerequisites: upgc, !mdrone.upgrade, !hovermam.upgrade
	TooltipExtras:
		Attributes: \n(!) Only ONE Mammoth Tank upgrade can be chosen

hovermam.upgrade:
	Buildable:
		Prerequisites: upgc, !ionmam.upgrade, !mdrone.upgrade
	TooltipExtras:
		Attributes: \n(!) Only ONE Mammoth Tank upgrade can be chosen

mdrone.upgrade:
	Buildable:
		Prerequisites: upgc, !ionmam.upgrade, !hovermam.upgrade
	TooltipExtras:
		Attributes: \n(!) Only ONE Mammoth Tank upgrade can be chosen

