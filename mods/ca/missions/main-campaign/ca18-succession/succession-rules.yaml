
# Simplified Chinese translation by lsxy, 2026.06.
^Palettes:
	TerrainLighting:
	TintPostProcessEffect:
		Red: 0.9
		Green: 1.0
		Blue: 1.2
		Ambient: 0.75

World:
	LuaScript:
		Scripts: campaign.lua, succession.lua
	MissionData:
		Briefing: 复仇的时刻到了，将军同志！凯恩的过度自信使他变得大意，尤里现已掌控了他的许多生化人。\n\n尽管这是绝好消息，但凯恩的生化人生产速度仍然太快，尤里难以完全应对。利用泰伯利亚增强尤里力量的研究已经开始，但要取得重大进展仍需时日。\n\n你必须回到生化人首次被释放的地方——你的前任曾在那里惨败，未能遏制住他们。主要的生化人生产设施仍在那里，我们必须夺取控制权，以防凯恩再次压倒我们。一旦生化人工厂落入我们掌控，将无人能挡。
	MapOptions:
		ShortGameCheckboxEnabled: False
	MusicPlaylist:
		StartingMusic: drok

Player:
	PlayerResources:
		DefaultCash: 6000

^PowerDrainable:
	Power@DiscPowerDrain:
		Amount: -50

TMPP:
	Inherits@CAMPAIGNDISABLED: ^Disabled
	CaptureManager:
	Capturable:
		RequiresCondition: !build-incomplete && !being-warped
		Types: building
	CapturableProgressBar:
	CapturableProgressBlink:
	Health:
		HP: 300000
	-Sellable:
	Targetable@NoAutoTarget:
		TargetTypes: NoAutoTarget

BIO:
	-OwnerLostAction:
	-SpawnActorOnDeath:
	-ProvidesPrerequisite@mortar:
	-ProvidesPrerequisite@toxintruck:
	Tooltip:
		Name: Cyborg Factory
	FireWarheadsOnDeath:
		Type: Footprint
		Weapon: BuildingExplode
		EmptyWeapon: BuildingExplode
	Health:
		HP: 300000
	RepairableBuilding:
		RepairStep: 500
		RepairPercent: 30
		RepairingNotification: Repairing
	Targetable@NoAutoTarget:
		TargetTypes: NoAutoTarget

