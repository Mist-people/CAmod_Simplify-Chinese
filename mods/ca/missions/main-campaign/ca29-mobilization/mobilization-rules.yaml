World:
	LuaScript:
		Scripts: campaign.lua, mobilization.lua
	MissionData:
		Briefing: 对泰伯利亚储存设施的攻击为我们赢得了宝贵的时间，最后进攻的准备工作正在进行中。我们从思金人心灵控制下解救出来的部队提供了重要情报，看来我们的怀疑是正确的。思金人与其母星的联系已被切断，他们正在试图打开一座星际传送门。他们一直囤积泰伯利亚，以提供这所需的巨大能量。\n\n思金人的主要大本营已被定位，我们正在集结一切可用的力量。凯恩显然又一次玩起了他的失踪把戏，随着斯大林已死，Nod兄弟会和苏联的临时领导层已同意休战，以便我们共同击败外星威胁。他们的指挥官正在前线附近的一个指挥所参加联席会议。\n\n[ 收到新通信 ]\n\n思金人似乎已经察觉了我们的计划……我们的指挥所报告称思金人的虫洞出现在整个区域，我们的增援正被切断。\n\n保护指挥所。增援部队将间歇性抵达，但你必须尽快摧毁这些虫洞，否则将被压倒。祝你好运。
