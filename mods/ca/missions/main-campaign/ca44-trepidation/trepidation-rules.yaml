# Simplified Chinese translation by lsxy, 2026.06.
^Palettes:
	TintPostProcessEffect:
		Red: 1
		Green: 1
		Blue: 1
		Ambient: 1

^BaseWorld:
	TerrainLighting:

World:
	LuaScript:
		Scripts: campaign.lua, trepidation.lua
	MissionData:
		Briefing: 苏联的突破已被击退，我们有了一个攻击苏联传送门的短暂机会窗口。然而，在行动之前，我们需要从潜伏在思金人母星上苏联部队中的谍报小组获取情报。\n\n该小组一直在等待关于第三个思金人派系抵达后全球防御组织(GDI)和Nod兄弟会状况的信息，但我们已数日未收到任何传输信号，这意味着他们要么已被发现，要么已失去隐蔽传输的能力。\n\n根据应急程序，我们预计有一名特工即将通过苏联传送门抵达。我们必须安全接应他，获取他掌握的任何新情报，然后盟军最高指挥部才能就下一步行动做出明智决策。\n\n带领一支小型特遣队进入位置接应我们的间谍。希望他能安全取得联系，以便你协调他的逃脱。一旦他安全，我们将决定局势是否需要进一步行动。
	MapOptions:
		ShortGameCheckboxEnabled: False
	MusicPlaylist:
		StartingMusic: backstab

Player:
	PlayerResources:
		DefaultCash: 6000
	ProvidesPrerequisitesOnTimeline:
		PauseOnCondition: !spy-extracted
	ExternalCondition@SpyExtracted:
		Condition: spy-extracted

