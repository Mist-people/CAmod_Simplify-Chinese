# Simplified Chinese translation by lsxy, 2026.06.
^Palettes:
	PaletteFromFile@terrain-temperat:
		Filename: alien.pal
	TintPostProcessEffect:
		Red: 1.3
		Green: 1
		Blue: 1.5
		Ambient: 0.5
	FixedColorPalette@BlueTiberium:
		Color: ffffff

^BaseWorld:
	TerrainLighting:
	ResourceRenderer:
		ResourceTypes:
			BlueTiberium:
				Name: Purified Tiberium

^BasePlayer:
	PlayerResources:
		ResourceValues:
			BlueTiberium: 25

World:
	LuaScript:
		Scripts: campaign.lua, reckoning.lua
	MissionData:
		Briefing: |-
			装置完美运行。方圆数英里内的思金人已不再依赖泰伯利亚生存，或依赖程度大幅降低。通过进一步使用该装置，所有思金人都可以从这一病痛中解脱。

			对我们而言，这意味着地球也能得到类似的净化，泰伯利亚的巨力可以在没有副作用的情况下被利用。

			关于主宰欺骗的消息在思金人中迅速传播。当然，愿意相信人类话语的仍然是少数，装置的效果也尚未广泛传播到足以说服更多思金人群体。

			然而，许多思金人已经起来反抗主宰的军队，我们正处于一场内战之中。

			主宰的部队正在整个星球上集结，我们几乎没有时间发动决定性打击。我已收到反抗军一位领袖的联络，他指出了主宰最精锐部队集结的位置，我们认为在那里击败他将足以削弱其权威，使天平向反抗军倾斜——至少在装置让所有思金人明白事态的严重性之前。

			反抗军已经与这些部队交火。得益于我们在多条其他战线上作战的兄弟们，我们的援助将是出其不意的。我希望你带领一支小型部队，在我方主力集结的同时援助反抗军，然后在主宰从星球各地调来的大军抵达之前，摧毁该地区的主宰主要基地。
	Player:
		PlayerResources:
			DefaultCash: 6000

