		Briefing: 全球防御组织(GDI)与盟军联合发动了进攻，企图夺取我们的铁幕装置之一。我们的处境仍然岌岌可危，因此绝不能再损失任何先进军事资产。\n\n战斗已持续数日，铁幕装置所在的基地严重受损。如今该基地四面受敌，我们的部队很快将被击溃——甚至更糟，被迫投降。\n\n我们已派遣一队工程师前去恢复电力。接管指挥权，打破围困，消灭所有全球防御组织(GDI)与盟军部队。
