World:
	LuaScript:
		Scripts: campaign.lua, supremacy.lua
	MissionData:
		Briefing: 我们的新型生化人军团已给予苏联人毁灭性打击，但这还不够。为了我的计划成功，必须向世人展示他们无与伦比的力量与服从。\n\n我们伟大胜利的消息已经传到全球防御组织(GDI)和盟军耳中，他们暂时搁置了彼此的不信任。盟军试图利用苏联的败绩在前线取得进展，而全球防御组织(GDI)已向我们发起进攻。\n\n两座基地即将陷落。牺牲其中一座以麻痹全球防御组织(GDI)，同时加强另一座的防御。一旦你建立起生化人生产线，全球防御组织(GDI)将毫无胜算。毫不留情，让所有人见证将带领兄弟会走向最终胜利的光荣进化。
	MapOptions:
		ShortGameCheckboxEnabled: False
