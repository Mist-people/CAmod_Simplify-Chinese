World:
	LuaScript:
		Scripts: campaign.lua, multipolarity.lua
	MissionData:
		Briefing: 我们的间谍已完成汇报，盟军最高指挥部紧急会议刚刚结束。\n\n第三个思金人派系已表明自己是一个被主宰放逐的古老教派——被其他思金人称为"邪灵"。眼见主宰的统治日渐衰弱，他们重新崛起，并已在思金人母星上取得重大进展。其确切性质和动机尚不明朗，但他们在推进过程中残暴无情。\n\n我们还得知全球防御组织(GDI)内部发生了一场明显政变。他们的最高指挥官连同大量部队仍留在思金人母星上，而一位霍桑将军抓住机会控制了地球上的全球防御组织(GDI)部队，在其领土上宣布戒严。\n\n他声称前往思金人母星的全球防御组织(GDI)部队现已与宿敌凯恩勾结，这代表着不可饶恕的背叛。显然全球防御组织(GDI)领导层中有些人比其他人更愿意搁置与凯恩的分歧。霍桑淡化了主宰的威胁，不认为反抗军的胜利必然有利。他还认为被净化的泰伯利亚并非凯恩所声称的恩赐，而是某个精密计划的一部分。\n\n我们对兄弟会的了解仍然有限，但盟军最高指挥部内有些人同情霍桑的观点。这些声音尚未成为多数，至少目前还没有。\n\n已达成共识：地球的安全必须是我们的优先事项。邪灵思金人和苏联-主宰联盟对人类构成生存威胁。基于此，我们的首要目标是控制并最终关闭所有连接思金人母星的传送门，然后阻止更多传送门被打开。\n\n苏联传送门现已关闭，我们所知的唯一另一个是由思金人母舰创建的。霍桑的部队完全控制着它，阻止任何星际部队返回。\n\n与将军的谈判毫无进展，因此通过武力夺取传送门控制权的行动已获批准。我们在该地区的旧基地，以及Nod兄弟会和苏联建立的基地，均已废弃并由全球防御组织(GDI)守卫。如果我们能控制这些基地，对全球防御组织(GDI)主基地的进攻将更容易。\n\n你的任务是确保传送门安全并占领霍桑将军的指挥中心。全球防御组织(GDI)的真正领导层将得以返回家园，之后我们将永久关闭传送门。\n\n我们的瑞典联盟合作伙伴已为本次任务提供援助。他们的冰冻武器应能有效削弱全球防御组织(GDI)的重型装甲。
	MapOptions:
		ShortGameCheckboxEnabled: False
	MusicPlaylist:
		StartingMusic: prp

