^BasePlayer:
	PlayerResources:
		ResourceValues:
			BlueTiberium: 25

World:
	LuaScript:
		Scripts: campaign.lua, schism.lua
	MissionData:
		Briefing: 主宰致以谢意，并正在集结部队准备新一轮攻势。\n\n凯恩用来扭曲泰伯利亚以谋私利的设备已被定位在反抗军据点内。其净化波每次使用都变得更加强大，影响范围不断扩大，导致无数思金人投靠了欺骗者凯恩。反抗军很快将势不可挡。\n\n主宰不敢将大军过于靠近该设备，但我们有一个计划。我们发现铁幕装置能够抵御净化能量，而思金人的护盾却无法做到。因此，主宰将提供给我们一台他仅存的灭世者三足机甲，用以攻击反抗军要塞。铁幕装置将与净化波同步，使灭世者能够突破反抗军防线，抵达设备处，并使用思金人虫洞将其提取。\n\n这就是凯恩来到这个世界想要夺取的宝物，我们相信其力量远超我们所見。如此强大的力量绝不能落入他手。主宰必须得到该设备，以恢复秩序。凯恩势必在此孤注一掷，否则一切努力将付诸东流，预计会遇到顽强抵抗。\n\n我们已尽可能集结部队，但建立基地的初步尝试因持续攻击而受阻。没有时间进行更多准备了。发动进攻，护送灭世者抵达设备处，为主宰夺取它。
	MapOptions:
		ShortGameCheckboxEnabled: False
	MusicPlaylist:
		StartingMusic: hm2

Player:
	PlayerResources:
		DefaultCash: 6000

