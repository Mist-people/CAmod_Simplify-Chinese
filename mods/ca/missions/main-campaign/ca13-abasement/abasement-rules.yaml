# Simplified Chinese translation by lsxy, 2026.06.
^Palettes:
	FlashPostProcessEffect@LIGHTNINGSTRIKE:
		Type: LightningStrike
	WeatherOverlay@RAIN:
		WindTick: 150, 550
		UseSquares: false
		ScatterDirection: 0, 0
		Gravity: 20, 25
		SwingOffset: 0, 0
		SwingSpeed: 0, 0
		SwingAmplitude: 0, 0
		ParticleColors: 72aaae, 72aea6, 5caea3, 6da69f
		LineTailAlphaValue: 30
		ParticleSize: 1, 1
		ParticleDensityFactor: 10
	TerrainLighting:
	TintPostProcessEffect:
		Red: 1.22
		Green: 1.27
		Blue: 1.15
		Ambient: 0.55

World:
	LuaScript:
		Scripts: campaign.lua, abasement.lua
	MissionData:
		Briefing: 将军同志，我们的部队未能及时阻止疯子凯恩释放他的新型生化人军团。我军因此遭受了灾难性的失败。\n\n各条战线形势严峻。盟军及其全球防御组织(GDI)盟友已恢复对我国西部领土的进攻，而外星入侵者继续通过虫洞在泰伯利亚矿藏处涌现。\n\n凯恩的军队出人意料地停止了推进，我们收到了一个提议。如果我们协助兄弟会夺回被思金人占领的领土并缴获一座信号发射器，凯恩承诺停止对我国的敌对行动。\n\n目前，我们别无选择。\n\n在被思金人占领的原Nod领土上建立基地。如果我们能夺取他们废弃的基地，Nod将提供增援。集结你的部队，夺取已知建在此区域的信号发射器。
	MapOptions:
		ShortGameCheckboxEnabled: False
	MusicPlaylist:
		StartingMusic: tren226m

Player:
	PlayerResources:
		DefaultCash: 6000

