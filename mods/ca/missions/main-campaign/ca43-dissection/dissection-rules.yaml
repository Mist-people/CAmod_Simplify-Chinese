# Simplified Chinese translation by lsxy, 2026.06.
^Palettes:
	TintPostProcessEffect:
		Red: 1
		Green: 1
		Blue: 1
		Ambient: 1
	PaletteFromFile@terrain-temperat:
		Name: terrain
		Tileset: TEMPERAT
		Filename: ca|missions/main-campaign/ca43-dissection/basejungle.pal
		ShadowIndex: 3, 4

World:
	LuaScript:
		Scripts: campaign.lua, dissection.lua
	MissionData:
		Briefing: 与苏联和平的希望已几乎破灭。斯大林那些对外交持开放态度的潜在继任者已被新任总理安托利·查丹科铲除——他在疯狂追求更多权力的过程中做出不可思议之举，与思金人主宰结盟，阻止了主宰被反抗军击败。\n\n当全球防御组织(GDI)、Nod兄弟会和思金人在思金人母星上激战时，苏联进行了大规模重新武装，如今在主宰的协助下，他们再次发动了公开敌对行动。\n\n我们与全球防御组织(GDI)的关系已经恶化。官方说法是，由于尤里和思金人神童的逃脱，他们不再信任我们处理安全和防务事务。这充满虚伪，我们怀疑他们有所隐瞒并以此为借口，但我们现在不能让联盟解体，因此暂时将疑虑搁置。\n\n还有令人不安的关于新威胁的报告：第三个思金人派系正无差别地发动战争。他们似乎已建立通往地球的传送门，但我们正在等待确认。\n\n我们的资源已捉襟见肘，因为同时应对多条战线上的敌人。盟军最高指挥部将召开会议讨论选项并制定未来战略，但一个需要立即关注的情况正在上演。\n\n苏联已向南推进穿过希腊，一路到达地中海沿岸。他们的目标似乎是土耳其，这是对通往思金人母星的传送门发动打击的唯一现实集结地。\n\n我们在土耳其的部队现已完全被切断并正在被包围。不能让苏联建立使传送门无法触及的缓冲区，否则主宰的部队将继续涌入。\n\n我们在苏联突出部两侧的阵地正遭受苏联轰炸和火箭炮击，濒临崩溃，急需增援。接管剩余部队，将苏联击退。\n\n频繁的轰炸由该地区众多苏联雷达站协调。摧毁它们应是首要任务。\n\n此外，作为盟军中的次要强国，希腊一直在开发令人印象深刻的新武器，可能在此次任务中派上用场。
	MapOptions:
		ShortGameCheckboxEnabled: False
	MusicPlaylist:
		StartingMusic: shut_it

