# Simplified Chinese translation by lsxy, 2026.06.
^Palettes:
	TintPostProcessEffect:
		Red: 0.8
		Green: 0.8
		Blue: 1
		Ambient: 0.9
	WeatherOverlay:
		ParticleDensityFactor: 16
		Gravity: 16, 24
		WindTick: 150, 425
		ScatterDirection: -12, 12
		ParticleSize: 2, 3
		ParticleColors: ECECEC44, E4E4E444, D0D0D044, BCBCBC44
		LineTailAlphaValue: 0

World:
	LuaScript:
		Scripts: campaign.lua, zenith.lua
	MissionData:
		Briefing: 尽管我已做出保证，苏联人仍向我们的神殿核心设施发动了大规模进攻。斯大林始终是个目光短浅的蠢货。\n\n为确保神殿安全，我们必须将苏联的核武库排除在威胁之外。我的线人报告说，苏联计划发射导弹消灭我军的防御主力，随后以坦克部队扫荡幸存者。\n\n苏联的导弹发射井位于一座重兵设防的岛屿上。我们的进攻位置并不理想，但趁苏军向南推进之际，我们应该能在海岸建立前进基地，在苏军增援抵达前突袭该岛。
	MapOptions:
		ShortGameCheckboxEnabled: False
	MusicPlaylist:
		StartingMusic: smsh226m

Player:
	PlayerResources:
		DefaultCash: 6000

