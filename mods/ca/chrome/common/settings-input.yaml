									Height: 16
									Font: Small
									Text: - 使用鼠标<右键>平移战场
								LabelWithHighlight@DESC_SCROLL_MIDDLE:
									Y: 85
									Width: PARENT_WIDTH
									Height: 16
									Font: Small
									Text: - 使用鼠标<中键>平移战场
								Label@DESC_EDGESCROLL:
									X: 9
									Y: 102
									Width: PARENT_WIDTH
									Height: 16
									Font: Small
									Text: 或将光标移动到屏幕边缘
				Container@ROW:
					Width: PARENT_WIDTH - 24
					Height: 20
					Children:
						Container@EDGESCROLL_CHECKBOX_CONTAINER:
							X: PARENT_WIDTH / 2 + 10
							Width: PARENT_WIDTH / 2 - 20
							Children:
								Checkbox@EDGESCROLL_CHECKBOX:
									Width: PARENT_WIDTH
									Height: 20
									Font: Regular
									Text: 屏幕边缘平移
				Container@ROW:
					Width: PARENT_WIDTH - 24
					Height: 20
					Children:
						Container@ALTERNATE_SCROLL_CHECKBOX_CONTAINER:
							X: PARENT_WIDTH / 2 + 10
							Width: PARENT_WIDTH / 2 - 20
							Children:
								Checkbox@ALTERNATE_SCROLL_CHECKBOX:
									Width: PARENT_WIDTH
									Height: 20
									Font: Regular
									Text: 备用鼠标平移
				Container@ROW:
					Width: PARENT_WIDTH - 24
					Height: 20
					Children:
						Container@LOCKMOUSE_CHECKBOX_CONTAINER:
							X: PARENT_WIDTH / 2 + 10
							Width: PARENT_WIDTH / 2 - 20
