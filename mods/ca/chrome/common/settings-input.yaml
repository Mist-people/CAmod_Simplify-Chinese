# Simplified Chinese translation by lsxy, 2026.06.
Container@INPUT_PANEL:
	Logic: InputSettingsLogic
	Width: PARENT_WIDTH
	Height: PARENT_HEIGHT
	Children:
		ScrollPanel@SETTINGS_SCROLLPANEL:
			Width: PARENT_WIDTH
			Height: PARENT_HEIGHT
			CollapseHiddenChildren: True
			TopBottomSpacing: 5
			ItemSpacing: 10
			Children:
				Background@INPUT_SECTION_HEADER:
					X: 5
					Width: PARENT_WIDTH - 24 - 10
					Height: 13
					Background: separator
					ClickThrough: True
					Children:
						Label@LABEL:
							Width: PARENT_WIDTH
							Height: PARENT_HEIGHT
							Font: TinyBold
							Align: Center
							Text: 输入
				Container@ROW:
					Width: PARENT_WIDTH - 24
					Height: 50
					Children:
						Container@MOUSE_CONTROL_CONTAINER:
							X: 10
							Width: PARENT_WIDTH / 2 - 20
							Children:
								Label@MOUSE_CONTROL_LABEL:
									Width: PARENT_WIDTH
									Height: 20
									Font: Regular
									Text: 操作方案：
								DropDownButton@MOUSE_CONTROL_DROPDOWN:
									Y: 25
									Width: PARENT_WIDTH
									Height: 25
									Font: Regular
						Container@ZOOM_MODIFIER_CONTAINER:
							X: PARENT_WIDTH / 2 + 10
							Width: PARENT_WIDTH / 2 - 20
							Children:
								Label@ZOOM_MODIFIER_LABEL:
									Width: PARENT_WIDTH
									Height: 20
									Font: Regular
									Text: 缩放修饰键：
								DropDownButton@ZOOM_MODIFIER:
									Y: 25
									Width: PARENT_WIDTH
									Height: 25
									Font: Regular
						Container@MOUSE_CONTROL_DESC_CLASSIC:
							X: 10
							Y: 55
							Width: PARENT_WIDTH
							Children:
								LabelWithHighlight@DESC_SELECTION:
									Width: PARENT_WIDTH
									Height: 16
									Font: Small
									Text: - 使用鼠标<左键>选择单位
								LabelWithHighlight@DESC_COMMANDS:
									Y: 17
									Width: PARENT_WIDTH
									Height: 16
									Font: Small
									Text: - 使用鼠标<左键>命令单位
								LabelWithHighlight@DESC_BUILDINGS:
									Y: 34
									Width: PARENT_WIDTH
									Height: 16
									Font: Small
									Text: - 使用鼠标<左键>放置建筑
								LabelWithHighlight@DESC_SUPPORT:
									Y: 51
									Width: PARENT_WIDTH
									Height: 16
									Font: Small
									Text: - 使用鼠标<左键>瞄准支援能力
								LabelWithHighlight@DESC_ZOOM:
									Y: 68
									Width: PARENT_WIDTH
									Height: 16
									Font: Small
									Text: - 使用<滚轮>缩放战场
								LabelWithHighlight@DESC_ZOOM_MODIFIER:
									Y: 68
									Width: PARENT_WIDTH
									Height: 16
									Font: Small
									Text: - 使用<修饰键 + 滚轮>缩放战场
								LabelWithHighlight@DESC_SCROLL_RIGHT:
									Y: 85
									Width: PARENT_WIDTH
									Height: 16
									Font: Small
									Text: - 使用鼠标<右键>平移战场
								LabelWithHighlight@DESC_SCROLL_MIDDLE:
									Y: 85
									Width: PARENT_WIDTH
									Height: 16
									Font: Small
									Text: - 使用鼠标<中键>平移战场
								Label@DESC_EDGESCROLL:
									X: 9
									Y: 102
									Width: PARENT_WIDTH
									Height: 16
									Font: Small
									Text: 或将光标移动到屏幕边缘
						Container@MOUSE_CONTROL_DESC_MODERN:
							X: 10
							Y: 55
