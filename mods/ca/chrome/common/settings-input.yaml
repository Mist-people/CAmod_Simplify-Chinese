								Slider@SCROLLSPEED_SLIDER:
									Y: 25
									Width: PARENT_WIDTH
									Height: 20
									Ticks: 7
									MinimumValue: 10
									MaximumValue: 50
				Container@ROW:
					Width: PARENT_WIDTH - 24
					Height: 50
					Children:
