# Simplified Chinese translation by lsxy, 2026.06.
Container@LOCAL_PROFILE_PANEL:
	Logic: LocalProfileLogic
	Width: 270
	Height: 100
	Children:
		Background@PROFILE_HEADER:
			Width: PARENT_WIDTH
			Height: 50
			Background: dialog2
			Children:
				Label@PROFILE_NAME:
					X: 10
					Y: 5
					Width: PARENT_WIDTH - 20
					Height: 25
					Font: MediumBold
				Label@PROFILE_RANK:
					X: 10
					Y: 24
					Width: PARENT_WIDTH - 20
					Height: 25
					Font: TinyBold
				Button@DESTROY_KEY:
					X: PARENT_WIDTH - 70
					Y: 15
					Width: 60
					Height: 20
					Font: TinyBold
					Text: 登出
		Background@BADGES_CONTAINER:
			Width: PARENT_WIDTH
			Y: 48
			Visible: false
			Background: dialog3
		Background@GENERATE_KEYS:
			Width: PARENT_WIDTH
			Height: PARENT_HEIGHT
			Background: dialog2
			Children:
				Label@DESC_A:
					Y: 5
					Width: PARENT_WIDTH
					Height: 25
					Font: Small
					Align: Center
					Text: 连接到论坛账号以向其他玩家
				Label@DESC_B:
					Y: 21
					Width: PARENT_WIDTH
					Height: 25
					Font: Small
					Align: Center
					Text: 表明你的身份，加入私人
				Label@DESC_C:
					Y: 37
					Width: PARENT_WIDTH
					Height: 25
					Font: Small
					Align: Center
					Text: 服务器并显示徽章。
				Button@GENERATE_KEY:
					X: (PARENT_WIDTH - WIDTH) / 2
					Y: 70
					Width: 240
					Height: 20
					Font: TinyBold
					Text: 连接到 OpenRA 论坛账号
		Background@GENERATING_KEYS:
			Width: PARENT_WIDTH
			Height: PARENT_HEIGHT
			Background: dialog2
			Children:
				Label@DESC_A:
					Y: 13
					Width: PARENT_WIDTH
					Height: 25
					Font: Small
					Align: Center
					Text: 正在生成身份验证密钥对。
				Label@DESC_B:
					Y: 29
					Width: PARENT_WIDTH
					Height: 25
					Font: Small
					Align: Center
					Text: 这需要几秒钟...
				ProgressBar:
					X: (PARENT_WIDTH - WIDTH) / 2
					Y: 70
					Width: 240
					Height: 20
					Indeterminate: true
		Background@REGISTER_FINGERPRINT:
			Width: PARENT_WIDTH
			Height: PARENT_HEIGHT
			Background: dialog2
			Children:
				Label@DESC_A:
					Y: 2
					Width: PARENT_WIDTH
					Height: 25
					Font: Small
					Align: Center
					Text: 身份验证密钥已复制到你的
				Label@DESC_B:
					Y: 18
					Width: PARENT_WIDTH
					Height: 25
					Font: Small
					Align: Center
					Text: 剪贴板。请将其添加到 OpenRA 论坛的
				Label@DESC_C:
					Y: 34
					Width: PARENT_WIDTH
					Height: 25
					Font: Small
					Align: Center
					Text: 用户控制面板中，然后按下继续。
				Button@DELETE_KEY:
					X: 15
					Y: 70
					Width: 70
					Height: 20
					Font: TinyBold
					Text: 取消
				Button@CHECK_KEY:
					X: 185
					Y: 70
					Width: 70
					Height: 20
					Font: TinyBold
					Text: 继续
		Background@CHECKING_FINGERPRINT:
			Width: PARENT_WIDTH
			Height: PARENT_HEIGHT
			Background: dialog2
			Children:
				Label@DESC_A:
					Y: 13
					Width: PARENT_WIDTH
					Height: 25
					Font: Small
					Align: Center
					Text: 正在从 OpenRA 论坛查询
				Label@DESC_B:
					Y: 29
					Width: PARENT_WIDTH
					Height: 25
					Font: Small
					Align: Center
					Text: 账号详情...
				ProgressBar:
					X: (PARENT_WIDTH - WIDTH) / 2
					Y: 70
					Width: 240
					Height: 20
					Indeterminate: true
		Background@FINGERPRINT_NOT_FOUND:
			Width: PARENT_WIDTH
			Height: PARENT_HEIGHT
			Background: dialog2
			Children:
				Label@DESC_A:
					Y: 13
					Width: PARENT_WIDTH
					Height: 25
					Font: Small
					Align: Center
					Text: 你的身份验证密钥未连接到
				Label@DESC_B:
					Y: 29
					Width: PARENT_WIDTH
					Height: 25
					Font: Small
					Align: Center
					Text: OpenRA 论坛账号。
				Button@FINGERPRINT_NOT_FOUND_CONTINUE:
					X: 185
					Y: 70
					Width: 70
					Height: 20
					Font: TinyBold
					Text: 返回
		Background@CONNECTION_ERROR:
			Width: PARENT_WIDTH
			Height: PARENT_HEIGHT
			Background: dialog2
			Children:
				Label@DESC_A:
					Y: 13
					Width: PARENT_WIDTH
					Height: 25
					Font: Small
					Align: Center
					Text: 无法连接到 OpenRA 论坛。
				Label@DESC_B:
					Y: 29
					Width: PARENT_WIDTH
					Height: 25
					Font: Small
					Align: Center
					Text: 请检查你的互联网连接。
				Button@CONNECTION_ERROR_RETRY:
					X: 185
					Y: 70
					Width: 70
					Height: 20
					Font: TinyBold
					Text: 重试

Container@PLAYER_PROFILE_BADGES_INSERT:
	Logic: PlayerProfileBadgesLogic
	Width: PARENT_WIDTH
	Height: 110
	Children:
		Container@BADGE_TEMPLATE:
			Width: PARENT_WIDTH
			Height: 25
			Children:
				Badge@ICON:
					X: 6
					Y: 1
					Width: 24
					Height: 24
				Label@LABEL:
					X: 36
					Y: 2
					Width: PARENT_WIDTH - 60
					Height: 24
					Font: Bold
