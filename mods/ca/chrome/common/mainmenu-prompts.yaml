# Simplified Chinese translation by lsxy, 2026.06.
Background@MAINMENU_INTRODUCTION_PROMPT:
	Logic: IntroductionPromptLogic
	X: (WINDOW_WIDTH - WIDTH) / 2
	Y: (WINDOW_HEIGHT - HEIGHT) / 2
	Width: 700
	Height: 525
	Children:
		Label@PROMPT_TITLE:
			Width: PARENT_WIDTH
			Y: 20
			Height: 25
			Font: Bold
			Align: Center
			Text: 正在建立战场控制
		Label@DESC_A:
			Width: PARENT_WIDTH
			Y: 50
			Height: 16
			Font: Regular
			Align: Center
			Text: 欢迎回来，指挥官！请使用以下选项初始化战斗参数。
		Label@DESC_B:
			Width: PARENT_WIDTH
			Y: 68
			Height: 16
			Font: Regular
			Align: Center
			Text: 其他选项可以稍后从设置菜单中配置。
		ScrollPanel@SETTINGS_SCROLLPANEL:
			X: 20
			Y: 100
			Width: PARENT_WIDTH - 40
			Height: PARENT_HEIGHT - 155
			CollapseHiddenChildren: True
			TopBottomSpacing: 5
			ItemSpacing: 10
			ScrollBar: Hidden
			Children:
				Background@PROFILE_SECTION_HEADER:
					X: 5
					Width: PARENT_WIDTH - 10
					Height: 13
					Background: separator
					ClickThrough: True
					Children:
						Label@LABEL:
							Width: PARENT_WIDTH
							Height: PARENT_HEIGHT
							Font: TinyBold
							Align: Center
							Text: 个人资料
				Container@ROW:
					Width: PARENT_WIDTH
					Height: 50
					Children:
						Container@PLAYER_CONTAINER:
							X: 10
							Width: PARENT_WIDTH / 2 - 20
							Children:
								Label@PLAYER:
									Width: PARENT_WIDTH
									Height: 20
									Text: 玩家名称：
								TextField@PLAYERNAME:
									Y: 25
									Width: PARENT_WIDTH
									Height: 25
									MaxLength: 16
									Text: 名称
						Container@PLAYERCOLOR_CONTAINER:
							X: PARENT_WIDTH / 2 + 10
							Width: PARENT_WIDTH / 2 - 20
							Children:
								Label@COLOR:
									Width: PARENT_WIDTH
									Height: 20
									Text: 首选颜色：
								DropDownButton@PLAYERCOLOR:
									Y: 25
									Width: 75
									Height: 25
									IgnoreChildMouseOver: true
									PanelAlign: Right
									Children:
										ColorBlock@COLORBLOCK:
											X: 5
											Y: 6
											Width: PARENT_WIDTH - 35
											Height: PARENT_HEIGHT - 12
				Container@SPACER:
				Background@INPUT_SECTION_HEADER:
					X: 5
					Width: PARENT_WIDTH - 10
					Height: 13
					Background: separator
					ClickThrough: True
					Children:
						Label@LABEL:
							Width: PARENT_WIDTH
							Height: PARENT_HEIGHT
							Font: TinyBold
							Align: Center
							Text: 输入
				Container@ROW:
					Width: PARENT_WIDTH
					Height: 50
					Children:
						Container@MOUSE_CONTROL_CONTAINER:
							X: 10
							Width: PARENT_WIDTH / 2 - 20
							Children:
								Label@MOUSE_CONTROL_LABEL:
									Width: PARENT_WIDTH
									Height: 20
									Font: Regular
									Text: 操作方案：
								DropDownButton@MOUSE_CONTROL_DROPDOWN:
									Y: 25
									Width: PARENT_WIDTH
									Height: 25
									Font: Regular
						Container@MOUSE_CONTROL_DESC_CLASSIC:
							X: PARENT_WIDTH / 2 + 10
							Width: PARENT_WIDTH / 2 - 20
							Children:
								LabelWithHighlight@DESC_SELECTION:
									Width: PARENT_WIDTH
									Height: 16
									Font: Small
									Text: - 使用鼠标<左键>选择单位
								LabelWithHighlight@DESC_COMMANDS:
									Y: 17
									Width: PARENT_WIDTH
									Height: 16
									Font: Small
									Text: - 使用鼠标<左键>命令单位
								LabelWithHighlight@DESC_BUILDINGS:
									Y: 34
									Width: PARENT_WIDTH
									Height: 16
									Font: Small
									Text: - 使用鼠标<左键>放置建筑
								LabelWithHighlight@DESC_SUPPORT:
									Y: 51
									Width: PARENT_WIDTH
									Height: 16
									Font: Small
									Text: - 使用鼠标<左键>瞄准支援能力
								LabelWithHighlight@DESC_ZOOM:
									Y: 68
									Width: PARENT_WIDTH
									Height: 16
									Font: Small
									Text: - 使用<滚轮>缩放战场
								LabelWithHighlight@DESC_ZOOM_MODIFIER:
									Y: 68
									Width: PARENT_WIDTH
									Height: 16
									Font: Small
									Text: - 使用<修饰键 + 滚轮>缩放战场
								LabelWithHighlight@DESC_SCROLL_RIGHT:
									Y: 85
									Width: PARENT_WIDTH
									Height: 16
									Font: Small
									Text: - 使用鼠标<右键>平移战场
								LabelWithHighlight@DESC_SCROLL_MIDDLE:
									Y: 85
									Width: PARENT_WIDTH
									Height: 16
									Font: Small
									Text: - 使用鼠标<中键>平移战场
								Label@DESC_EDGESCROLL:
									X: 9
									Y: 102
									Width: PARENT_WIDTH
									Height: 16
									Font: Small
									Text: 或将光标移动到屏幕边缘
						Container@MOUSE_CONTROL_DESC_MODERN:
							X: PARENT_WIDTH / 2 + 10
							Width: PARENT_WIDTH / 2 - 20
							Children:
								LabelWithHighlight@DESC_SELECTION:
									Width: PARENT_WIDTH
									Height: 16
									Font: Small
									Text: - 使用鼠标<左键>选择单位
								LabelWithHighlight@DESC_COMMANDS:
									Y: 17
									Width: PARENT_WIDTH
									Height: 16
									Font: Small
									Text: - 使用鼠标<右键>命令单位
								LabelWithHighlight@DESC_BUILDINGS:
									Y: 34
									Width: PARENT_WIDTH
									Height: 16
									Font: Small
									Text: - 使用鼠标<左键>放置建筑
								LabelWithHighlight@DESC_SUPPORT:
									Y: 51
									Width: PARENT_WIDTH
									Height: 16
									Font: Small
									Text: - 使用鼠标<左键>瞄准支援能力
								LabelWithHighlight@DESC_ZOOM:
									Y: 68
									Width: PARENT_WIDTH
									Height: 16
									Font: Small
									Text: - 使用<滚轮>缩放战场
								LabelWithHighlight@DESC_ZOOM_MODIFIER:
									Y: 68
									Width: PARENT_WIDTH
									Height: 16
									Font: Small
									Text: - 使用<修饰键 + 滚轮>缩放战场
								LabelWithHighlight@DESC_SCROLL_RIGHT:
									Y: 85
									Width: PARENT_WIDTH
									Height: 16
									Font: Small
									Text: - 使用鼠标<右键>平移战场
								LabelWithHighlight@DESC_SCROLL_MIDDLE:
									Y: 85
									Width: PARENT_WIDTH
									Height: 16
									Font: Small
									Text: - 使用鼠标<中键>平移战场
								Label@DESC_EDGESCROLL:
									X: 9
									Y: 102
									Width: PARENT_WIDTH
									Height: 16
									Font: Small
									Text: 或将光标移动到屏幕边缘
				Container@ROW:
					Width: PARENT_WIDTH
					Height: 20
					Children:
						Container@EDGESCROLL_CHECKBOX_CONTAINER:
							X: 10
							Width: PARENT_WIDTH / 2 - 20
							Children:
								Checkbox@EDGESCROLL_CHECKBOX:
									Width: PARENT_WIDTH
									Height: 20
									Font: Regular
									Text: 屏幕边缘平移
				Container@SPACER:
					Height: 30
				Background@DISPLAY_SECTION_HEADER:
					X: 5
					Width: PARENT_WIDTH - 10
					Height: 13
					Background: separator
					ClickThrough: True
					Children:
						Label@LABEL:
							Width: PARENT_WIDTH
							Height: PARENT_HEIGHT
							Font: TinyBold
							Align: Center
							Text: 显示
				Container@ROW:
					Width: PARENT_WIDTH
					Height: 50
					Children:
						Container@BATTLEFIELD_CAMERA_DROPDOWN_CONTAINER:
							X: 10
							Width: PARENT_WIDTH / 2 - 20
							Children:
								Label@BATTLEFIELD_CAMERA:
									Width: PARENT_WIDTH
									Height: 20
									Text: 战场视角：
								DropDownButton@BATTLEFIELD_CAMERA_DROPDOWN:
									Y: 25
									Width: PARENT_WIDTH
									Height: 25
									Font: Regular
						Container@UI_SCALE_DROPDOWN_CONTAINER:
							X: PARENT_WIDTH / 2 + 10
							Width: PARENT_WIDTH / 2 - 20
							Children:
								Label@UI_SCALE:
									Width: PARENT_WIDTH
									Height: 20
									Text: UI 缩放：
								DropDownButton@UI_SCALE_DROPDOWN:
									Y: 25
									Width: PARENT_WIDTH
									Height: 25
									Font: Regular
				Container@ROW:
					Width: PARENT_WIDTH
					Height: 20
					Children:
						Container@CURSORDOUBLE_CHECKBOX_CONTAINER:
							X: PARENT_WIDTH / 2 + 10
							Width: PARENT_WIDTH / 2 - 20
							Children:
								Checkbox@CURSORDOUBLE_CHECKBOX:
									Width: PARENT_WIDTH
									Height: 20
									Font: Regular
									Text: 增大光标尺寸
		Button@CONTINUE_BUTTON:
			X: PARENT_WIDTH - 180
			Y: PARENT_HEIGHT - 45
			Width: 160
			Height: 25
			Text: 继续
			Font: Bold
			Key: return

Background@MAINMENU_SYSTEM_INFO_PROMPT:
	Logic: SystemInfoPromptLogic
	X: (WINDOW_WIDTH - WIDTH) / 2
	Y: (WINDOW_HEIGHT - HEIGHT) / 2
	Width: 600
	Height: 430
	Children:
		Label@PROMPT_TITLE:
			Width: PARENT_WIDTH
			Y: 20
			Height: 25
			Font: Bold
			Align: Center
			Text: 正在建立战场控制
		Label@PROMPT_TEXT_A:
			X: 15
			Y: 50
			Width: PARENT_WIDTH - 30
			Height: 16
			Align: Center
			Text: 我们想收集一些系统信息以帮助优化 OpenRA。
		Label@PROMPT_TEXT_B:
			X: 15
			Y: 68
			Width: PARENT_WIDTH - 30
			Height: 16
			Align: Center
			Text: 在您同意的情况下，每次游戏启动时将发送以下匿名数据：
		ScrollPanel@SYSINFO_DATA:
			X: 20
			Y: 98
			Width: PARENT_WIDTH - 40
			Height: 355 - 98 - 10
			TopBottomSpacing: 4
			ItemSpacing: 4
			Children:
				Label@DATA_TEMPLATE:
					X: 8
					Height: 13
					VAlign: Top
					Font: Small
		Checkbox@SYSINFO_CHECKBOX:
			X: 390
			Y: 353
			Width: 200
			Height: 20
			Font: Regular
			Text: 发送系统信息
		Button@CONTINUE_BUTTON:
			X: PARENT_WIDTH - WIDTH - 20
			Y: PARENT_HEIGHT - 45
			Width: 160
			Height: 25
			Text: 继续
			Font: Bold
			Key: return
