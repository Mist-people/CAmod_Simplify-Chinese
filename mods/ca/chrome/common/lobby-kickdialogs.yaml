# Simplified Chinese translation by lsxy, 2026.06.
Background@KICK_CLIENT_DIALOG:
	Width: PARENT_WIDTH
	Height: PARENT_HEIGHT
	Logic: KickClientLogic
	Background: dialog3
	Children:
		Label@TITLE:
			Y: 41
			Width: PARENT_WIDTH
			Height: 25
			Font: Bold
			Align: Center
		Label@TEXTA:
			Y: 68
			Width: PARENT_WIDTH
			Height: 25
			Font: Regular
			Align: Center
			Text: 你也可以施加临时封禁，
		Label@TEXTB:
			Y: 86
			Width: PARENT_WIDTH
			Height: 25
			Font: Regular
			Align: Center
			Text: 阻止他们在本局游戏剩余时间内重新加入。
		Checkbox@PREVENT_REJOINING_CHECKBOX:
			X: (PARENT_WIDTH - WIDTH) / 2
			Y: 120
			Width: 150
			Height: 20
			Text: 临时封禁
		Button@OK_BUTTON:
			X: (PARENT_WIDTH - WIDTH) / 2 + 75
			Y: 155
			Width: 120
			Height: 25
			Text: 踢出
			Font: Bold
		Button@CANCEL_BUTTON:
			X: (PARENT_WIDTH - WIDTH) / 2 - 75
			Y: 155
			Width: 120
			Height: 25
			Text: 取消
			Font: Bold

