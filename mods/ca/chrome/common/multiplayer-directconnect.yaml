# Simplified Chinese translation by lsxy, 2026.06.
Background@DIRECTCONNECT_PANEL:
	Logic: DirectConnectLogic
	X: (WINDOW_WIDTH - WIDTH) / 2
	Y: (WINDOW_HEIGHT - HEIGHT) / 2
	Width: 450
	Height: 160
	Children:
		Label@DIRECTCONNECT_LABEL_TITLE:
			X: 0
			Y: 21
			Width: 450
			Height: 25
			Text: 连接到服务器
			Align: Center
			Font: Bold
		Label@ADDRESS_LABEL:
			X: 20
			Y: 60
			Width: 125
			Height: 25
			Align: Right
			Text: 服务器地址：
		TextField@IP:
			X: 150
			Y: 60
			Width: 210
			MaxLength: 50
			Height: 25
		Label@PORT_LABEL:
			X: 360
			Y: 60
			Width: 10
			Height: 25
			Align: Center
			Text: 端口：
		TextField@PORT:
			X: 370
			Y: 60
			Width: 60
			MaxLength: 5
			Height: 25
			Type: Integer
		Button@JOIN_BUTTON:
			X: PARENT_WIDTH - 430
			Y: PARENT_HEIGHT - 45
			Width: 160
			Height: 25
			Text: 加入
			Font: Bold
			Key: return
		Button@BACK_BUTTON:
			X: PARENT_WIDTH - 180
			Y: PARENT_HEIGHT - 45
			Width: 160
			Height: 25
			Text: 取消
			Font: Bold
			Key: escape
