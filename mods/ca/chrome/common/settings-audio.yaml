# Simplified Chinese translation by lsxy, 2026.06.
Container@AUDIO_PANEL:
	Logic: AudioSettingsLogic
	Width: PARENT_WIDTH
	Height: PARENT_HEIGHT
	Children:
		ScrollPanel@SETTINGS_SCROLLPANEL:
			Width: PARENT_WIDTH
			Height: PARENT_HEIGHT
			CollapseHiddenChildren: True
			TopBottomSpacing: 5
			ItemSpacing: 10
			Children:
				Background@AUDIO_SECTION_HEADER:
					X: 5
					Width: PARENT_WIDTH - 24 - 10
					Height: 13
					Background: separator
					ClickThrough: True
					Children:
						Label@LABEL:
							Width: PARENT_WIDTH
							Height: PARENT_HEIGHT
							Font: TinyBold
							Align: Center
							Text: 音频
				Container@ROW:
					Width: PARENT_WIDTH - 24
					Height: 20
					Children:
						Container@NO_AUDIO_DEVICE_CONTAINER:
							X: 10
							Width: PARENT_WIDTH - 10
							Children:
								Label@NO_AUDIO_DEVICE:
									Width: PARENT_WIDTH
									Height: 20
									Align: Center
									Text: 音频控制需要活动的声音设备
				Container@ROW:
					Width: PARENT_WIDTH - 24
					Height: 50
					Children:
						Container@CASH_TICKS_CONTAINER:
							X: 10
							Width: PARENT_WIDTH / 2 - 20
							Children:
								Checkbox@CASH_TICKS:
									Width: PARENT_WIDTH
									Height: 20
									Font: Regular
									Text: 资金滴答声
						Container@MUTE_SOUND_CONTAINER:
							X: 10
							Y: 30
							Width: PARENT_WIDTH / 2 - 20
							Children:
								Checkbox@MUTE_SOUND:
									Width: PARENT_WIDTH
									Height: 20
									Font: Regular
									Text: 静音
						Container@SOUND_VOLUME_CONTAINER:
							X: PARENT_WIDTH / 2 + 10
							Width: PARENT_WIDTH / 2 - 20
							Children:
								Label@SOUND_LABEL:
									Width: PARENT_WIDTH
									Height: 20
									Text: 音效音量：
								ExponentialSlider@SOUND_VOLUME:
									Y: 30
									Width: PARENT_WIDTH
									Height: 20
									Ticks: 7
				Container@ROW:
					Width: PARENT_WIDTH - 24
					Height: 50
					Children:
						Container@MUTE_BACKGROUND_MUSIC_CONTAINER:
							X: 10
							Width: PARENT_WIDTH / 2 - 20
							Children:
								Checkbox@MUTE_BACKGROUND_MUSIC:
									Width: PARENT_WIDTH
									Height: 20
									Font: Regular
									Text: 菜单音乐静音
									TooltipText: 无特定曲目播放时静音背景音乐
									TooltipContainer: SETTINGS_TOOLTIP_CONTAINER
						Container@MUSIC_VOLUME_CONTAINER:
							X: PARENT_WIDTH / 2 + 10
							Width: PARENT_WIDTH / 2 - 20
							Children:
								Label@MUSIC_LABEL:
									Width: PARENT_WIDTH
									Height: 20
									Text: 音乐音量：
								ExponentialSlider@MUSIC_VOLUME:
									Y: 25
									Width: PARENT_WIDTH
									Height: 20
									Ticks: 7
				Container@ROW:
					Width: PARENT_WIDTH - 24
					Height: 50
					Children:
						Container@AUDIO_DEVICE_CONTAINER:
							X: 10
							Width: PARENT_WIDTH / 2 - 20
							Children:
								Label@AUDIO_DEVICE_LABEL:
									Width: PARENT_WIDTH
									Height: 20
									Text: 音频设备：
								DropDownButton@AUDIO_DEVICE:
									Y: 25
									Width: PARENT_WIDTH
									Height: 25
						Container@VIDEO_VOLUME_CONTAINER:
							X: PARENT_WIDTH / 2 + 10
							Width: PARENT_WIDTH / 2 - 20
							Children:
								Label@VIDEO_LABEL:
									Width: PARENT_WIDTH
									Height: 20
									Text: 视频音量：
								ExponentialSlider@VIDEO_VOLUME:
									Y: 25
									Width: PARENT_WIDTH
									Height: 20
									Ticks: 7
				Container@ROW:
					Width: PARENT_WIDTH - 24
					Height: 20
					Children:
						Container@RESTART_REQUIRED_CONTAINER:
							X: 10
							Width: PARENT_WIDTH - 10
							Children:
								Label@AUDIO_RESTART_REQUIRED_DESC:
									Width: PARENT_WIDTH
									Height: 20
									Font: Tiny
									Align: Center
									Text: 设备更改将在游戏重启后生效
