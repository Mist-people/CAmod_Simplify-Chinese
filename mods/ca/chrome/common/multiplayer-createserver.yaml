			Font: Bold
			Key: escape
		Button@CREATE_BUTTON:
			Key: return
			X: PARENT_WIDTH - 2 * WIDTH - 30
			Y: PARENT_HEIGHT - 45
			Width: 120
			Height: 25
			Text: 创建
			Font: Bold
		TooltipContainer@TOOLTIP_CONTAINER:
