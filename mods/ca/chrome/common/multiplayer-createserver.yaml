# Simplified Chinese translation by lsxy, 2026.06.
Background@MULTIPLAYER_CREATESERVER_PANEL:
	Logic: ServerCreationLogic
	X: (WINDOW_WIDTH - WIDTH) / 2
	Y: (WINDOW_HEIGHT - HEIGHT) / 2
	Width: 530
	Height: 315
	Children:
		Label@TITLE:
			Y: 16
			Width: PARENT_WIDTH
			Height: 25
			Text: 创建服务器
			Align: Center
			Font: Bold
		Label@SERVER_NAME_LABEL:
			Y: 45
			Width: 105
			Height: 25
			Align: Right
			Text: 服务器名称：
		TextField@SERVER_NAME:
			X: 110
			Y: 45
			Width: 215
			MaxLength: 50
			Height: 25
			Text: 我的 OpenRA 服务器
		Label@PASSWORD_LABEL:
			Y: 80
			Width: 105
			Height: 25
			Align: Right
			Text: 密码：
		PasswordField@PASSWORD:
			X: 110
			Y: 80
			Width: 145
			MaxLength: 20
			Height: 25
		Label@AFTER_PASSWORD_LABEL:
			X: 265
			Y: 80
			Width: 95
			Height: 25
			Align: Left
			Text: （可选）
		Label@LISTEN_PORT_LABEL:
			Y: 115
			Width: 105
			Height: 25
			Align: Right
			Text: 端口：
		TextField@LISTEN_PORT:
			X: 110
			Y: 115
			Width: 50
			Height: 25
			MaxLength: 5
			Text: 1234
			Type: Integer
		Checkbox@ADVERTISE_CHECKBOX:
			X: 180
			Y: 117
			Width: 150
			Height: 20
			Font: Regular
			Text: 在线上发布
		Label@NOTICES_HEADER_A:
			X: 20
			Y: 156
			Height: 25
			Align: Left
			Font: Bold
		Label@NOTICES_HEADER_B:
			X: 20
			Y: 156
			Height: 25
			Align: Left
			Font: Bold
		Label@NOTICES_HEADER_C:
			X: 20
			Y: 156
			Height: 25
			Align: Left
			Font: Bold
		Container@NOTICES_LAN:
			X: 25
			Y: 176
			Width: PARENT_WIDTH
			Height: PARENT_HEIGHT
			Children:
				Label@ADVERTISING:
					Width: 305
					Height: 25
					Font: Tiny
					Align: Left
					Text: - 游戏将仅在局域网内发布。
				Label@FIREWALL:
					Y: 12
					Width: 305
					Height: 25
					Font: Tiny
					Align: Left
					Text: - 你必须手动配置防火墙以允许连接。
				Label@PORTFORWARD_A:
					Y: 24
					Width: 305
					Height: 25
					Font: Tiny
					Align: Left
					Text: - 如果你手动配置路由器端口转发，
				Label@PORTFORWARD_B:
					X: 7
					Y: 36
					Width: 295
					Height: 25
					Font: Tiny
					Align: Left
					Text: 玩家可以通过互联网使用直连IP连接。
		Container@NOTICES_NO_UPNP:
			X: 25
			Y: 176
			Width: PARENT_WIDTH
			Height: PARENT_HEIGHT
			Children:
				Label@ADVERTISING:
					Width: 305
					Height: 25
					Font: Tiny
					Align: Left
					Text: - 游戏将发布到局域网和互联网。
				Label@FIREWALL:
					Y: 12
					Width: 305
					Height: 25
					Font: Tiny
					Align: Left
					Text: - 你必须手动配置防火墙以允许连接。
				Label@PORTFORWARD_A:
					Y: 24
					Width: 305
					Height: 25
					Font: Tiny
					Align: Left
					Text: - 你必须手动配置路由器以允许并转发
				Label@PORTFORWARD_B:
					X: 7
					Y: 36
					Width: 295
					Height: 25
					Font: Tiny
					Align: Left
					Text: 到你的本地IP和端口的连接。
				Label@SETTINGS_A:
					Y: 48
					Width: 305
					Height: 25
					Font: Tiny
					Align: Left
					Text: - 你可以在设置菜单的高级选项卡中
				Label@SETTINGS_B:
					X: 7
					Y: 60
					Width: 295
					Height: 25
					Font: Tiny
					Align: Left
					Text: 启用 UPnP/NAT-PMP（如果路由器支持）。
		Container@NOTICES_UPNP:
			X: 25
			Y: 176
			Width: PARENT_WIDTH
			Height: PARENT_HEIGHT
			Children:
				Label@ADVERTISING:
					Width: 305
					Height: 25
					Font: Tiny
					Align: Left
					Text: - 游戏将发布到局域网和互联网。
				Label@FIREWALL:
					Y: 12
					Width: 305
					Height: 25
					Font: Tiny
					Align: Left
					Text: - 你必须手动配置防火墙以允许连接。
				Label@PORTFORWARD_A:
					Y: 24
					Width: 305
					Height: 25
					Font: Tiny
					Align: Left
					Text: - 游戏将自动配置端口转发。
				Label@SETTINGS_A:
					Y: 36
					Width: 305
					Height: 25
					Font: Tiny
					Align: Left
					Text: - 你可以在设置菜单中禁用 UPnP/NAT-PMP。
		Container@MAP_PREVIEW_ROOT:
			X: PARENT_WIDTH - 194
			Y: 45
			Width: 174
			Height: 250
		Button@MAP_BUTTON:
			X: 20
			Y: PARENT_HEIGHT - 45
			Width: 120
			Height: 25
			Text: 更换地图
			Font: Bold
		Button@BACK_BUTTON:
			X: PARENT_WIDTH - WIDTH - 20
			Y: PARENT_HEIGHT - 45
			Width: 120
			Height: 25
