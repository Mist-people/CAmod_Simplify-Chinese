# Simplified Chinese translation by lsxy, 2026.06.
Container@GAMESAVE_LOADING_SCREEN:
	Logic: GameSaveLoadingLogic
	Width: WINDOW_WIDTH
	Height: WINDOW_HEIGHT
	Children:
		LogicKeyListener@CANCEL_HANDLER:
		Image@LOGO:
			X: (WINDOW_WIDTH - 1024) / 2
			Y: (WINDOW_HEIGHT - 256) / 2
			ImageCollection: loading-artwork
			ImageName: logo
		Label@TITLE:
			Width: WINDOW_WIDTH
			Y: 3 * WINDOW_HEIGHT / 4 - 29
			Height: 25
			Font: Bold
			Align: Center
			Text: 正在载入存档
		ProgressBar@PROGRESS:
			X: (WINDOW_WIDTH - 500) / 2
			Y: 3 * WINDOW_HEIGHT / 4
			Width: 500
			Height: 20
			Background: observer-scrollpanel-button-pressed
			Bar: observer-scrollpanel-button
		Label@DESC:
			Width: WINDOW_WIDTH
			Y: 3 * WINDOW_HEIGHT / 4 + 19
			Height: 25
			Font: Regular
			Align: Center
			Text: 按 Escape 取消加载并返回主菜单
		Label@DESC2:
			Width: WINDOW_WIDTH
			Y: 3 * WINDOW_HEIGHT / 4 + 19 + 30
			Height: 25
			Font: Small
			Align: Center
			Text: 加载时间较长，这是因为 OpenRA 引擎处理存档的方式所致。
			TextColor: 777777
		Label@DESC3:
			Width: WINDOW_WIDTH
			Y: 3 * WINDOW_HEIGHT / 4 + 19 + 48
			Height: 25
			Font: Small
			Align: Center
			Text: 它从游戏开头以最快速度重放——因此游戏越长，加载时间越长。
			TextColor: 777777
